[project]
name = "cip"
version = "0.1.0"
description = "Customer Intelligence Platform: churn x value, explanations and an investigation agent on Databricks."
readme = "README.md"
requires-python = ">=3.11,<3.13"
# Core deps only: this wheel is installed on Databricks serverless, where pyspark is provided.
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
]

[project.scripts]
cip-ingest = "cip.data.ingest:main"

[project.optional-dependencies]
ml = [
    "scikit-learn>=1.5",
    "lightgbm>=4.3",
    "shap>=0.46",
    "mlflow>=2.16",
    "databricks-feature-engineering>=0.6",
]
gateway = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "databricks-sdk>=0.30",
    "databricks-sql-connector>=3.4",
    "prometheus-fastapi-instrumentator>=7.0",
]
agent = [
    "langgraph>=0.2",
    "langchain-anthropic>=0.2",
    "langchain-mcp-adapters>=0.1",
    "mcp>=1.2",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pyspark>=3.5",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "pre-commit>=3.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cip"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "N", "RUF"]
ignore = ["N812"] # `from pyspark.sql import functions as F` is the PySpark convention

[tool.uv]
# Match Databricks serverless runtimes; PySpark does not yet support pandas 3.
constraint-dependencies = ["pandas<3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "spark: needs a local SparkSession (Java 17)",
    "databricks: needs a live workspace; skipped in CI unit stage",
]
